<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luie — The writing workspace for web novelists</title>
    <meta
      name="description"
      content="Manuscripts, worldbuilding, snapshots and export in one flow. Luie, a word processor built for web novelists."
    />
    <link rel="icon" type="image/png" href="/luie.png" />
    <link rel="apple-touch-icon" href="/luie.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f7" />

    <!-- TODO(SITE_URL): 도메인 확정 시 https://luie.app 일괄 교체 (SITE_URL으로 grep) -->
    <link rel="canonical" href="https://luie.app/en/" />
    <link rel="alternate" hreflang="ko" href="https://luie.app/" />
    <link rel="alternate" hreflang="en" href="https://luie.app/en/" />
    <link rel="alternate" hreflang="ja" href="https://luie.app/ja/" />
    <link rel="alternate" hreflang="x-default" href="https://luie.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luie" />
    <meta property="og:title" content="Luie — The writing workspace for web novelists" />
    <meta
      property="og:description"
      content="Manuscripts, worldbuilding, snapshots and export in one flow. Luie, a word processor built for web novelists."
    />
    <meta property="og:url" content="https://luie.app/en/" />
    <!-- 임시 이미지(974×1024) — 1200×630 전용 OG 이미지 제작 시 교체 -->
    <meta property="og:image" content="https://luie.app/luie.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Luie — The writing workspace for web novelists" />
    <meta
      name="twitter:description"
      content="Manuscripts, worldbuilding, snapshots and export in one flow. Luie, a word processor built for web novelists."
    />
    <meta name="twitter:image" content="https://luie.app/luie.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme (or system default) before first paint to avoid a flash.
      (function () {
        var saved = localStorage.getItem("luie-theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
