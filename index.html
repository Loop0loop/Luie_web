<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luie — 웹소설 작가를 위한 집필 워크스페이스</title>
    <meta
      name="description"
      content="원고, 세계관, 스냅샷, 내보내기를 하나의 흐름으로. 웹소설 작가를 위한 워드프로세서 Luie."
    />
    <link rel="icon" type="image/png" href="/luie.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 첫 페인트 전에 저장된 테마(없으면 시스템 설정)를 적용해 플래시를 막는다.
      (function () {
        var saved = localStorage.getItem("luie-theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
